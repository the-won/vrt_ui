<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>변형 A · 클래식 사이드바 — 대시보드</title>
	<script>
		/* FOUC 방지: 페인트 이전에 테마를 먼저 결정한다 */
		(function () {
			try {
				var saved = localStorage.getItem("dashboard-theme");
				var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
				document.documentElement.setAttribute("data-theme", theme);
			} catch (e) {
				document.documentElement.setAttribute("data-theme", "light");
			}
		})();
	</script>
	<link rel="stylesheet" href="assets/css/tokens.css" />
	<link rel="stylesheet" href="assets/css/base.css" />
	<link rel="stylesheet" href="assets/css/components.css" />
	<link rel="stylesheet" href="assets/css/layout-classic.css" />
</head>
<body>
	<div class="app-shell" data-app-shell data-sidebar-state="expanded">

		<!-- 사이드바 -->
		<aside class="sidebar" aria-label="주 내비게이션">
			<div class="sidebar__brand">
				<div class="sidebar__brand-mark">
					<span class="logo-glyph"></span>
					<span class="sidebar__brand-label">Dashboard</span>
				</div>
				<button class="btn btn--icon" data-sidebar-collapse aria-label="사이드바 접기/펼치기">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round" />
					</svg>
				</button>
			</div>

			<nav class="sidebar__nav scroll-region">
				<div class="nav-group">
					<div class="nav-group__title">Overview</div>
					<a class="nav-item nav-item--active" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Dashboard</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Analytics</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Reports</span>
					</a>
				</div>
				<div class="nav-group">
					<div class="nav-group__title">Manage</div>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Projects</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Team</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Settings</span>
					</a>
				</div>
			</nav>

			<div class="sidebar__footer">
				<span class="avatar" aria-hidden="true"></span>
				<div class="sidebar__user-info">
					<span class="skeleton skeleton--label"></span>
				</div>
				<button class="btn btn--icon" aria-label="사용자 메뉴">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<circle cx="12" cy="6" r="1.4" />
						<circle cx="12" cy="12" r="1.4" />
						<circle cx="12" cy="18" r="1.4" />
					</svg>
				</button>
			</div>
		</aside>

		<!-- 톱바 -->
		<header class="topbar">
			<nav class="topbar__breadcrumb" aria-label="이동 경로">
				<span>Workspace</span>
				<span aria-hidden="true">›</span>
				<span>Dashboard</span>
			</nav>

			<div class="topbar__search search-field">
				<svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
					<circle cx="11" cy="11" r="7" />
					<path d="M21 21l-4.3-4.3" stroke-linecap="round" />
				</svg>
				<input type="text" placeholder="검색..." aria-label="검색" />
			</div>

			<div class="topbar__actions">
				<button class="theme-toggle" data-theme-toggle aria-label="테마 전환">
					<svg class="icon-glyph icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<path d="M21 12.5A8.5 8.5 0 0111.5 3 8.5 8.5 0 1021 12.5z" stroke-linejoin="round" />
					</svg>
					<svg class="icon-glyph icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<circle cx="12" cy="12" r="4.5" />
						<path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round" />
					</svg>
				</button>
				<button class="btn btn--icon" aria-label="설정">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<circle cx="12" cy="12" r="3.2" />
						<path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14.2 3H9.8l-.4 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 002 1.2l.4 2.6h4.4l.4-2.6a7 7 0 002-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z" stroke-linejoin="round" />
					</svg>
				</button>
				<span class="topbar__divider" aria-hidden="true"></span>
				<span class="avatar" aria-hidden="true"></span>
			</div>
		</header>

		<!-- 메인 -->
		<main class="main scroll-region" data-scroll-shadow-root>
			<div class="page-header" data-sticky-header>
				<div class="card__title-slot">
					<span class="skeleton skeleton--title" style="height:22px;"></span>
				</div>
				<div class="page-header__actions">
					<button class="btn">
						<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;">
							<path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" />
						</svg>
						Filter
					</button>
					<button class="btn btn--primary">
						<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;">
							<path d="M12 5v14M5 12h14" stroke-linecap="round" />
						</svg>
						New
					</button>
				</div>
			</div>

			<div class="content-grid">
				<!-- KPI 스트립 -->
				<div class="card kpi-card span-3">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
						<span class="skeleton skeleton--icon"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
						<span class="skeleton skeleton--text" style="width:40%;"></span>
					</div>
				</div>
				<div class="card kpi-card span-3">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
						<span class="skeleton skeleton--icon"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
						<span class="skeleton skeleton--text" style="width:40%;"></span>
					</div>
				</div>
				<div class="card kpi-card span-3">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
						<span class="skeleton skeleton--icon"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
						<span class="skeleton skeleton--text" style="width:40%;"></span>
					</div>
				</div>
				<div class="card kpi-card span-3">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
						<span class="skeleton skeleton--icon"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
						<span class="skeleton skeleton--text" style="width:40%;"></span>
					</div>
				</div>

				<!-- 메인 차트 + 사이드 패널 -->
				<div class="card chart-panel span-8">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
						<div class="card__actions-slot">
							<span class="chip">Weekly</span>
							<span class="chip chip--active">Monthly</span>
						</div>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--chart"></span>
					</div>
				</div>
				<div class="card side-panel span-4">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--text"></span>
						<span class="skeleton skeleton--text"></span>
						<span class="skeleton skeleton--text"></span>
						<span class="skeleton skeleton--chart" style="min-height:80px;"></span>
					</div>
				</div>

				<!-- 보조 패널 + 테이블 패널 -->
				<div class="card support-panel span-4">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--avatar"></span>
						<span class="skeleton skeleton--text"></span>
						<span class="skeleton skeleton--text"></span>
					</div>
				</div>
				<div class="card table-panel span-8">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
						<div class="card__actions-slot">
							<span class="skeleton skeleton--icon"></span>
						</div>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--table-row"></span>
						<span class="skeleton skeleton--table-row"></span>
						<span class="skeleton skeleton--table-row"></span>
						<span class="skeleton skeleton--table-row"></span>
					</div>
				</div>
			</div>
		</main>
	</div>

	<a href="index.html" class="btn" style="position:fixed;left:16px;bottom:16px;z-index:20;box-shadow:var(--shadow-md);">← 갤러리로</a>

	<script src="assets/js/theme.js"></script>
	<script src="assets/js/shell.js"></script>
</body>
</html>
