<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>변형 C · 멀티패널 분석 — 대시보드</title>
	<script>
		(function () {
			try {
				var saved = localStorage.getItem("dashboard-theme");
				var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
				document.documentElement.setAttribute("data-theme", theme);
			} catch (e) {
				document.documentElement.setAttribute("data-theme", "light");
			}
		})();
	</script>
	<link rel="stylesheet" href="assets/css/tokens.css" />
	<link rel="stylesheet" href="assets/css/base.css" />
	<link rel="stylesheet" href="assets/css/components.css" />
	<link rel="stylesheet" href="assets/css/layout-analytics.css" />
</head>
<body>
	<div class="app-shell" data-app-shell data-sidebar-state="expanded" data-drawer-state="open">

		<!-- 사이드바 (클래식형과 동일 구조) -->
		<aside class="sidebar" aria-label="주 내비게이션">
			<div class="sidebar__brand">
				<div class="sidebar__brand-mark">
					<span class="logo-glyph"></span>
					<span class="sidebar__brand-label">Dashboard</span>
				</div>
				<button class="btn btn--icon" data-sidebar-collapse aria-label="사이드바 접기/펼치기">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round" />
					</svg>
				</button>
			</div>

			<nav class="sidebar__nav scroll-region">
				<div class="nav-group">
					<div class="nav-group__title">Overview</div>
					<a class="nav-item nav-item--active" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Overview</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Traffic</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Revenue</span>
					</a>
				</div>
				<div class="nav-group">
					<div class="nav-group__title">Manage</div>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Segments</span>
					</a>
					<a class="nav-item" href="#">
						<span class="nav-item__icon"></span>
						<span class="nav-item__label">Settings</span>
					</a>
				</div>
			</nav>

			<div class="sidebar__footer">
				<span class="avatar" aria-hidden="true"></span>
				<div class="sidebar__user-info">
					<span class="skeleton skeleton--label"></span>
				</div>
				<button class="btn btn--icon" aria-label="사용자 메뉴">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<circle cx="12" cy="6" r="1.4" />
						<circle cx="12" cy="12" r="1.4" />
						<circle cx="12" cy="18" r="1.4" />
					</svg>
				</button>
			</div>
		</aside>

		<!-- 톱바 -->
		<header class="topbar">
			<div class="topbar__workspace">
				<span>Workspace</span>
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px;color:var(--text-muted);">
					<path d="M7 9l5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
				</svg>
			</div>
			<div class="topbar__search search-field">
				<svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
					<circle cx="11" cy="11" r="7" />
					<path d="M21 21l-4.3-4.3" stroke-linecap="round" />
				</svg>
				<input type="text" placeholder="검색..." aria-label="검색" />
			</div>
			<div class="topbar__actions">
				<button class="theme-toggle" data-theme-toggle aria-label="테마 전환">
					<svg class="icon-glyph icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<path d="M21 12.5A8.5 8.5 0 0111.5 3 8.5 8.5 0 1021 12.5z" stroke-linejoin="round" />
					</svg>
					<svg class="icon-glyph icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<circle cx="12" cy="12" r="4.5" />
						<path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round" />
					</svg>
				</button>
				<button class="btn btn--icon" data-drawer-toggle aria-label="인스펙터 토글">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<rect x="3" y="4" width="18" height="16" rx="2" />
						<path d="M15 4v16" />
					</svg>
				</button>
				<span class="avatar" aria-hidden="true"></span>
			</div>
		</header>

		<!-- 필터바 -->
		<div class="filterbar" data-tab-group>
			<div class="filterbar__tabs">
				<a href="#" data-tab class="is-active">Overview</a>
				<a href="#" data-tab>Traffic</a>
				<a href="#" data-tab>Revenue</a>
			</div>
			<div class="filterbar__spacer"></div>
			<div class="filterbar__controls">
				<span class="chip">⌗ Segment</span>
				<div class="date-picker">
					<button class="chip" data-date-picker-toggle aria-haspopup="dialog" aria-expanded="false">
						📅 <span data-date-picker-label>Last 30d</span>
					</button>
					<div class="date-picker__panel" data-date-picker-panel hidden>
						<div class="date-picker__header">
							<button class="btn btn--icon" data-date-picker-prev aria-label="이전 달" type="button">
								<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;">
									<path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
							<span class="date-picker__title" data-date-picker-title></span>
							<button class="btn btn--icon" data-date-picker-next aria-label="다음 달" type="button">
								<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;">
									<path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
						</div>
						<div class="date-picker__weekdays">
							<span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
						</div>
						<div class="date-picker__grid" data-date-picker-grid></div>
					</div>
				</div>
			</div>
		</div>

		<!-- 메인 -->
		<main class="main scroll-region">
			<div class="kpi-strip">
				<div class="card">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
					</div>
				</div>
				<div class="card">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
					</div>
				</div>
				<div class="card">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
					</div>
				</div>
				<div class="card">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
					</div>
				</div>
				<div class="card">
					<div class="card__header">
						<span class="skeleton skeleton--label"></span>
					</div>
					<div class="card__body kpi-card__body">
						<span class="skeleton skeleton--kpi-value"></span>
					</div>
				</div>
			</div>

			<div class="panel-grid">
				<div class="card chart-panel span-6">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--chart"></span>
					</div>
				</div>
				<div class="card chart-panel span-6">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--chart"></span>
					</div>
				</div>

				<div class="card table-panel span-8">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
						<span class="skeleton skeleton--icon"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--table-row"></span>
						<span class="skeleton skeleton--table-row"></span>
						<span class="skeleton skeleton--table-row"></span>
					</div>
				</div>
				<div class="card list-panel span-4">
					<div class="card__header">
						<span class="skeleton skeleton--title"></span>
					</div>
					<div class="card__body">
						<span class="skeleton skeleton--avatar"></span>
						<span class="skeleton skeleton--text"></span>
						<span class="skeleton skeleton--avatar"></span>
						<span class="skeleton skeleton--text"></span>
					</div>
				</div>
			</div>
		</main>

		<!-- 인스펙터 드로어 -->
		<aside class="inspector" aria-label="인스펙터">
			<div class="inspector__header">
				<span class="skeleton skeleton--title"></span>
				<button class="btn btn--icon" data-drawer-toggle aria-label="인스펙터 닫기">
					<svg class="icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
						<path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
					</svg>
				</button>
			</div>
			<div style="display:flex;flex-direction:column;gap:var(--sp-16);">
				<span class="skeleton skeleton--chart" style="min-height:140px;"></span>
				<span class="skeleton skeleton--text"></span>
				<span class="skeleton skeleton--text"></span>
				<span class="skeleton skeleton--text"></span>
			</div>
		</aside>
	</div>

	<a href="index.html" class="btn" style="position:fixed;left:16px;bottom:16px;z-index:40;box-shadow:var(--shadow-md);">← 갤러리로</a>

	<script src="assets/js/theme.js"></script>
	<script src="assets/js/shell.js"></script>
</body>
</html>
